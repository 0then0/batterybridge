name: Release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version and notes
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then python_cmd=python; else python_cmd=python3; fi
          "$python_cmd" - <<'PY'
          import os, pathlib, re
          version = re.search(r'^version = "([^"]+)"', pathlib.Path('Cargo.toml').read_text(), re.M)[1]
          tag = os.environ['RELEASE_TAG']
          if tag and tag != 'v' + version:
              raise SystemExit(f'Tag {tag} does not match Cargo version {version}')
          if not re.search(r'^## \[' + re.escape(version) + r'\] - \d{4}-\d{2}-\d{2}$', pathlib.Path('CHANGELOG.md').read_text(), re.M):
              raise SystemExit(f'Missing dated changelog entry for {version}')
          PY
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native graphics and packaging prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev fonts-noto-cjk rpm
      - name: Package lifecycle checks
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Windows lifecycle checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-permissions.ps1; ./packaging/windows/test-lifecycle.ps1
      - name: Native Windows installer preparation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-preinstall.ps1
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --all-features --release --locked
        if: runner.os != 'macOS'
      - name: Build universal macOS binaries and installer
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          python3 packaging/macos/build-universal.py
          python3 -m unittest discover -s packaging/macos/tests -v
          python3 packaging/macos/build-pkg.py --output BatteryBridge-macos-universal.pkg
          pkgutil --check-signature BatteryBridge-macos-universal.pkg || test "$?" -eq 1
      - name: Build Windows installer with background task
        if: runner.os == 'Windows'
        run: python packaging/windows/build.py
      - name: Verify Windows installation and removal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/test-installer.ps1
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName BatteryBridge-windows-x86_64-setup.exe
      - name: Build Linux desktop packages with systemd service
        if: runner.os == 'Linux'
        run: |
          python3 packaging/linux/build.py deb
          python3 packaging/linux/build.py rpm
      - name: Verify Debian package installation and removal
        if: runner.os == 'Linux'
        run: |
          ./packaging/linux/test-installer.sh
          cp target/release/bundle/deb/*.deb BatteryBridge-linux-x86_64.deb
          cp target/release/bundle/rpm/*.rpm BatteryBridge-linux-x86_64.rpm
      - name: Stage CLI, daemon, service definitions and license
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          if ($IsWindows) { $suffix = '.exe' } else { $suffix = '' }
          $build = if ($IsMacOS) { 'target/universal-apple-darwin/release' } else { 'target/release' }
          Copy-Item "$build/batterybridge$suffix" artifact/
          Copy-Item "$build/batterybridge-service$suffix" artifact/
          Copy-Item README.md,LICENSE,CHANGELOG.md,CONTRIBUTING.md,CODE_OF_CONDUCT.md,SECURITY.md artifact/
          Copy-Item -Recurse packaging,docs,assets artifact/
          Copy-Item -Recurse "$build/bundle" artifact/gui
          Copy-Item "$build/batterybridge-gui$suffix" artifact/gui/
          Copy-Item -Recurse assets/licenses artifact/gui/licenses
          $root = (Resolve-Path artifact).Path
          $hashes = Get-ChildItem artifact -Recurse -File | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $hashes | Set-Content artifact/SHA256SUMS.txt
          if ($IsWindows) {
            Compress-Archive -Path artifact/* -DestinationPath batterybridge-${{ matrix.label }}.zip
          } else {
            tar -czf batterybridge-${{ matrix.label }}.tar.gz -C artifact .
            if ($LASTEXITCODE -ne 0) { throw 'Failed to archive release artifacts' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: batterybridge-${{ matrix.label }}
          path: |
            batterybridge-*.zip
            batterybridge-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: BatteryBridge-*
          if-no-files-found: error
  publish:
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ['TAG']
          version = tag.removeprefix('v')
          source = pathlib.Path('CHANGELOG.md').read_text()
          entry = re.search(r'^## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=^## |\Z)', source, re.M | re.S)
          if not entry:
              raise SystemExit(f'No release notes for {tag}')
          notes = entry[1].strip().replace('](docs/', f"](https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{tag}/docs/")
          pathlib.Path('release-notes.md').write_text(notes + '\n')
          PY
          cd release-assets
          sha256sum -- * > SHA256SUMS.txt
          args=()
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "BatteryBridge $TAG" \
            --notes-file ../release-notes.md "${args[@]}" -- *
