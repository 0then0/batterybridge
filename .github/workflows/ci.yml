name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native graphics prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev fonts-noto-cjk xvfb
      - name: Package lifecycle checks
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Windows lifecycle and native preparation checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-permissions.ps1; ./packaging/windows/test-lifecycle.ps1; ./packaging/windows/test-preinstall.ps1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --all-features --locked
      - name: Linux native GUI startup
        if: runner.os == 'Linux'
        run: |
          set +e
          timeout 8s xvfb-run -a target/debug/batterybridge-gui --preview apps/gui/tests/status.json
          result=$?
          test "$result" -eq 124
      - name: Windows native GUI startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-gui.ps1
      - name: macOS installer lifecycle checks
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s packaging/macos/tests -v
