[package]
name = "batterybridge-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.98"
repository.workspace = true
readme.workspace = true
description = "Native battery status and charging settings built with egui."

[dependencies]
chrono.workspace = true
batterybridge-protocol.workspace = true
batterybridge-ipc.workspace = true
batterybridge-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
ron = "=0.12.2"
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "accesskit", "persistence"] }
egui = { version = "=0.36.2", features = ["serde"] }
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }
fastframe-autostart = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }

[target.'cfg(target_os = "macos")'.dependencies]
fastframe-dock = { git = "https://github.com/crmne/fastframe", tag = "v0.14.1" }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows' built-in OpenGL driver exposes only 1.1. Use native WGPU backends.
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu"] }
